services:
  app:
    build:
      context: .
      args:
        PDF_EMBEDDING_MODEL: ${PDF_EMBEDDING_MODEL}
    env_file:
      - .env.example
      - .env
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 5000
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${APP_PORT}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    environment:
      LUMEN_API_URL: http://app:5000
    ports:
      - "127.0.0.1:${STREAMLIT_PORT}:8501"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: ${QDRANT_IMAGE}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
