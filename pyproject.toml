[project]
name = "lumen-home-assistant"
version = "0.1.0"
description = "Lumen Home customer-support assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "pydantic>=2.7,<3",
    "pymupdf>=1.24,<2",
    "qdrant-client>=1.15,<1.16",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
]
